name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-minimal:
    # The library's core promise: numpy is the only required dependency.
    # The GPU/autograd/Cython test modules probe their deps and skip, so
    # this matrix also verifies the graceful-degradation paths.
    name: minimal numpy-only (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e . pytest
      - run: python -m pytest tests/ -q

  test-full-cpu:
    # Everything that runs without a GPU: compiled Cython kernels and the
    # autograd mirror of the API.  Also gates the tutorial snippets.
    name: full CPU (py3.12, cython + autograd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . pytest "autograd==1.7.0" "cython>=3.0.10"
      - run: python build_cython.py build_ext --inplace
      - run: python -m pytest tests/ -q
      - run: python tutorials/check_snippets.py
