[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["numpy_keras*"]

[project]
name = "numpy-keras"
version = "2.1.0"
description = "A deep learning library from scratch using NumPy — MLP, CNN and RNN (SimpleRNN/LSTM/GRU) — written to read like a textbook."
authors = [{ name="Jiarui Xu", email="xujiarui98@foxmail.com" }]
dependencies = [
    "numpy==1.26.4"
]

[project.optional-dependencies]
viz = [
    "tqdm==4.66.1",
    "matplotlib==3.8.2"
]
autograd = [
    "autograd==1.7.0"
]
autograd-viz = [
    "tqdm==4.66.1",
    "matplotlib==3.8.2",
    "autograd==1.7.0"
]
cython = [
    "cython>=3.0.10"
]
all = [
    "tqdm==4.66.1",
    "matplotlib==3.8.2",
    "autograd==1.7.0",
    "cython>=3.0.10",
]

[project.urls]
Homepage = "https://github.com/XavierSpycy/NumPy-Keras"